<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Tasos IPTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

#list {
    width: 15%;
    height: 100vh;
    background: #111;
    padding: 6px;
    overflow-y: auto;
    position: fixed;
    left: 0;
    top: 0;
    transition: transform 0.3s ease; /* Weicher Übergang beim Verstecken */
    z-index: 10;
}

/* Diese CSS-Klasse schiebt die Senderliste komplett aus dem Bildschirm */
body.fullscreen #list {
    transform: translateX(-100%);
}

#playerArea {
    position: fixed;
    right: 0;
    top: 0;
    width: 85%;
    height: 100vh;
    background: #000;
    transition: width 0.3s ease, left 0.3s ease;
}

/* Wenn Vollbild aktiv ist, dehnt sich der Player auf die vollen 100% aus */
body.fullscreen #playerArea {
    width: 100%;
    left: 0;
}

#video, iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
}

/* Der Vollbild-Knopf oben rechts im Player-Bereich */
#fullscreenBtn {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 99999;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    border: 1px solid #444;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}
#fullscreenBtn:hover {
    background: #0070f3;
    border-color: #0070f3;
}

.channel {
    padding: 18px;
    font-size: 22px;
    border-bottom: 1px solid #333;
    cursor: pointer;
}

.channel.active {
    background: #2a5f2a;
    font-weight: bold;
}

#status {
    position: absolute;
    left: 15px;
    bottom: 15px;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    max-width: 75%;
    line-height: 1.5;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<!-- Senderliste -->
<div id="list"></div>

<!-- Player Bereich mit integriertem Vollbild-Umschalter -->
<div id="playerArea">
    <button id="fullscreenBtn" onclick="toggleFullscreen()">📺 Vollbild Ein/Aus</button>
    <video id="video" controls autoplay playsinline></video>
    <div id="status">Status: initialisiert</div>
</div>

<script>
// Proxy-Basis
const proxy = "/api/proxy?url=";

// Sicherheits-Änderung: Wir halten nur die rohen Zeilen im RAM.
// Keine fertigen URLs im Voraus generieren, damit textContent im Browser leer bleibt!
let roheM3UZeilen = [];
let kanalIndexListe = []; 
let hls = null;

const webOnlyChannels = {
    "91nrg": "https://nrg91.gr/tv/"
};

// Funktion zum Umschalten des Vollbildmodus
function toggleFullscreen() {
    document.body.classList.toggle("fullscreen");
}

function setStatus(msg) {
    document.getElementById("status").textContent = msg;
}

function stopVideo() {
    const video = document.getElementById("video");
    try { video.pause(); } catch(e) {}
    if (video) video.src = "";
    if (hls) { try { hls.destroy(); } catch(e) {} hls = null; }
}

function resetPlayerArea() {
    const playerArea = document.getElementById("playerArea");
    // Wir behalten den Vollbild-Button beim Zurücksetzen bei
    playerArea.innerHTML = `
        <button id="fullscreenBtn" onclick="toggleFullscreen()">📺 Vollbild Ein/Aus</button>
        <video id="video" controls autoplay playsinline></video>
        <div id="status">Status: initialisiert</div>
    `;
}

// Holt die Playlist sicher über deine unsichtbare API-Route ab
function loadPlaylist() {
    setStatus("Playlist wird geladen...");
    fetch("/api/proxy")
        .then(r => r.text())
        .then(daten => {
            roheM3UZeilen = daten.split(/\r?\n/);
            baueKanalListe();
        })
        .catch(err => {
            console.error(err);
            setStatus("Fehler beim Laden der Playlist.");
        });
}

// Filtert nur die Namen heraus, um die Sidebar zu füllen (URLs bleiben versteckt)
function baueKanalListe() {
    kanalIndexListe = [];
    let aktuellerName = "";

    roheM3UZeilen.forEach((zeile, index) => {
        const getrimmteZeile = zeile.trim();
        if (getrimmteZeile.startsWith("#EXTINF")) {
            const parts = getrimmteZeile.split(",");
            aktuellerName = parts[1]?.trim() || "Unbenannt";
        } else if (getrimmteZeile.startsWith("http")) {
            kanalIndexListe.push({
                name: aktuellerName,
                zeilenNummer: index
            });
        }
    });

    renderList();
    if (kanalIndexListe.length > 0) {
        playChannel(0); // Startet den ersten Kanal automatisch
    }
}

function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    kanalIndexListe.forEach((ch, i) => {
        const div = document.createElement("div");
        div.textContent = ch.name;
        div.className = "channel";
        if (i === 0) div.classList.add("active");
        div.onclick = () => {
            // Aktive optische Markierung verschieben
            document.querySelectorAll('.channel').forEach(el => el.classList.remove('active'));
            div.classList.add('active');
            handleChannel(ch, i);
        };
        list.appendChild(div);
    });
}

// Extrahiert die URL erst exakt im Moment des Abrufens flüchtig aus dem Speicher
function extrahiereKanalUrl(index) {
    const kanalInfo = kanalIndexListe[index];
    if (!kanalInfo) return "";
    
    const echteUrl = roheM3UZeilen[kanalInfo.zeilenNummer].trim();
    return echteUrl.endsWith(".m3u8") ? echteUrl : proxy + encodeURIComponent(echteUrl);
}

function handleChannel(ch, index) {
    const name = ch.name.toLowerCase();

    // Funktion für iFrames, um den Vollbild-Knopf zu erhalten
    const setIframeView = (srcUrl, statusText, extraStyle = "") => {
        resetPlayerArea();
        stopVideo();
        document.getElementById("playerArea").innerHTML = `
            <button id="fullscreenBtn" onclick="toggleFullscreen()">📺 Vollbild Ein/Aus</button>
            <iframe src="${srcUrl}" style="width:100%;height:100%;border:none;background:#000;${extraStyle}" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
            <div id="status">${statusText}</div>
        `;
    };

    if (name === "skaiweb") {
        setIframeView("https://www.skai.gr/tv/live/", "Skai Live (Clean-View)");
        return;
    }

    if (name === "ant1web") {
        setIframeView("https://www.antenna.gr/live", "ANT1 Live (Clean-View)");
        return;
    }

    if (name === "megaweb") {
        setIframeView("https://www.megatv.com/live", "Mega TV Live (Clean-View)", "margin-top:-60px;");
        return;
    }

    if (name === "makweb") {
        setIframeView("https://www.antenna.gr/livemak", "Makedonia TV Live (Clean-View)");
        return;
    }

    if (name === "alphaweb") {
        setIframeView(proxy + encodeURIComponent('https://www.alphatv.gr/live'), "Alpha TV Live (Clean-View)");
        return;
    }

    if (name === "skai sp1") {
        setIframeView("https://www.sportfmtv.gr/el/media-video/sport-fm-linear-channel-1", "SKAI TV1 (Clean-View)");
        return;
    }

    if (name === "skai sp2") {
        setIframeView("https://www.sportfmtv.gr/el/media-video/sport-fm-linear-channel-2", "SKAI TV2 (Clean-View)");
        return;
    }

    if (name === "skai sp3") {
        setIframeView("https://www.sportfmtv.gr/el/media-video/sport-fm-linear-channel-3", "SKAI TV3 (Clean-View)");
        return;
    }

    if (name === "pontos") {
        setIframeView("https://pontostv.com/live-tv/", "Pontos TV (Clean-View)");
        return;
    }

    if (webOnlyChannels[name]) {
        resetPlayerArea();
        stopVideo();
        window.open(webOnlyChannels[name], "_blank");
        setStatus("Web-Kanal geöffnet: " + ch.name);
        return;
    }

    // Normale Streams
    resetPlayerArea();
    playChannel(index);
}

function playChannel(index) {
    const ch = kanalIndexListe[index];
    if (ch) {
        const berechneteUrl = extrahiereKanalUrl(index);
        playStream(berechneteUrl, ch.name);
    }
}

function playStream(url, name) {
    const video = document.getElementById("video");
    if (hls) { hls.destroy(); hls = null; }

    setStatus("Starte Stream: " + name);

    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else if (video && video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
    }
}

// Startet den Ladevorgang beim Seitenaufruf automatisch
loadPlaylist();
</script>

</body>
</html>
