#video {

    top: 0;

.channel {
    padding: 18px;
    font-size: 22px;
    border-bottom: 1px solid #333;

}

.channel.active {

    font-weight: bold;

#status {
    position: absolute;
    left: 15px;
    bottom: 15px;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;

    line-height: 1.5;

function setStatus(msg) {
    document.getElementById("status").textContent = msg;
}

function stopVideo() {
    const video = document.getElementById("video");
    try { video.pause(); } catch(e) {}
    video.src = "";
    if (hls) { try { hls.destroy(); } catch(e) {} hls = null; }
}

function resetPlayerArea() {
    const playerArea = document.getElementById("playerArea");
    playerArea.innerHTML = `
        <video id="video" controls autoplay playsinline></video>
        <div id="status">Status: initialisiert</div>
    `;
}

function loadPlaylist() {
    setStatus("Playlist wird geladen...");
    fetch(playlistURL)
        .then(r => r.text())
        .then(parseM3U)
        .catch(err => {
            console.error(err);
            setStatus("Fehler beim Laden der Playlist.");
        });
}

function parseM3U(data) {
    const lines = data.split(/\r?\n/);
    let name = "";

    channels = [];

    lines.forEach(line => {
        line = line.trim();
        if (line.startsWith("#EXTINF")) {
            const parts = line.split(",");
            name = parts[1]?.trim() || "Unbenannt";
        } else if (line.startsWith("http")) {
            const isHLS = line.endsWith(".m3u8");

            channels.push({
                name,
                url: isHLS
                    ? line
                    : proxy + encodeURIComponent(line)
            });
        }
    });

    renderList();
    playChannel(0);
}

function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    channels.forEach((ch, i) => {
        const div = document.createElement("div");
        div.textContent = ch.name;
        div.className = "channel";
        div.onclick = () => handleChannel(ch, i);
        list.appendChild(div);
    });
}

function playChannel(index) {
    const ch = channels[index];
    playStream(ch.url, ch.name);
}

function playStream(url, name) {
    const video = document.getElementById("video");

    if (hls) { hls.destroy(); hls = null; }

    setStatus("Starte Stream: " + name);

    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else {
        video.src = url;
        video.play();
    }
}
