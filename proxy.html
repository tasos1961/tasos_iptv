<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tasos Proxy (Video)</title>
</head>
<body>
<script>
(async () => {
  const url = new URL(window.location.href).searchParams.get("url");
  if (!url) {
    document.body.innerHTML = "<h3>Proxy aktiv – bitte ?url= hinzufügen</h3>";
    return;
  }

  try {
    const response = await fetch(url);
    const contentType = response.headers.get("content-type");

    if (contentType && contentType.includes("application/vnd.apple.mpegurl")) {
      // Wenn es eine .m3u8-Datei ist → direkt weiterleiten
      const blob = await response.blob();
      const videoURL = URL.createObjectURL(blob);
      document.body.innerHTML = `
        <video controls autoplay style="width:100%;height:100%">
          <source src="${videoURL}" type="application/vnd.apple.mpegurl">
          Dein Browser unterstützt HLS nicht.
        </video>`;
    } else {
      // Normale HTML-Seite anzeigen
      const text = await response.text();
      document.write(text);
    }
  } catch (e) {
    document.body.innerHTML = "<h3>Fehler beim Laden: " + e + "</h3>";
  }
})();
</script>
</body>
</html>
