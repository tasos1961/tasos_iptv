<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Tasos IPTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

#list {
    width: 15%; /* vorher 35% → jetzt schmaler */
    height: 100vh;
    background: #111;
    padding: 6px; /* etwas weniger Innenabstand */
    overflow-y: auto;
    position: fixed;
    left: 0;
    top: 0;
}

#playerArea {
    position: fixed;
    right: 0;
    top: 0;
    width: 85%; /* vorher 65% → jetzt breiter */
    height: 100vh;
    background: #000;
}


#video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

.channel {
    padding: 18px;
    font-size: 22px;
    border-bottom: 1px solid #333;
    cursor: pointer;
}



.channel.active {
    background: #2a5f2a;
    font-weight: bold;
}

#status {
    position: absolute;
    left: 15px;
    bottom: 15px;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    max-width: 75%;
    line-height: 1.5;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<div id="list"></div>

<div id="playerArea">
    <video id="video" controls autoplay playsinline></video>
    <div id="status">Status: initialisiert</div>
</div>

<script>
// 🔥 Dein stabiler Vercel‑Proxy
const proxy = "https://tasosiptv.vercel.app/api/proxy?url=";

// Playlist
const playlistURL =
    "https://gist.githubusercontent.com/tasos1961/ded73b64497f7a01f672962072d0a7ee/raw/BGREEK_TV.m3u";

let channels = [];
let hls = null;

// Web‑Kanäle → sollen IMMER im neuen Tab geöffnet werden
const webOnlyChannels = {
    "euronewsgr": "https://gr.euronews.com/live"
};

    

function setStatus(msg) {
    document.getElementById("status").textContent = msg;
}

function stopVideo() {
    const video = document.getElementById("video");
    try { video.pause(); } catch(e) {}
    video.src = "";
    if (hls) { try { hls.destroy(); } catch(e) {} hls = null; }
}

    function resetPlayerArea() {
    const playerArea = document.getElementById("playerArea");
    playerArea.innerHTML = `
        <video id="video" controls autoplay playsinline></video>
        <div id="status">Status: initialisiert</div>
    `;
}


function loadPlaylist() {
    setStatus("Playlist wird geladen...");
    fetch(playlistURL)
        .then(r => r.text())
        .then(parseM3U)
        .catch(err => {
            console.error(err);
            setStatus("Fehler beim Laden der Playlist.");
        });
}

function parseM3U(data) {
    const lines = data.split(/\r?\n/);
    let name = "";

    channels = [];

    lines.forEach(line => {
        line = line.trim();
        if (line.startsWith("#EXTINF")) {
            const parts = line.split(",");
            name = parts[1]?.trim() || "Unbenannt";
        } else if (line.startsWith("http")) {
            const isHLS = line.endsWith(".m3u8");

            channels.push({
                name,
                url: isHLS
                    ? line
                    : proxy + encodeURIComponent(line)
            });
        }
    });

    renderList();
    playChannel(0);
}

function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    channels.forEach((ch, i) => {
        const div = document.createElement("div");
        div.textContent = ch.name;
        div.className = "channel";
        div.onclick = () => handleChannel(ch, i);
        list.appendChild(div);
    });
}

function handleChannel(ch, index) {
    const name = ch.name.toLowerCase();

    // ⭐ Clean-View für skaiweb
   if (name.toLowerCase() === "skaiweb") {
        resetPlayerArea();
        stopVideo();
        const playerArea = document.getElementById("playerArea");
        playerArea.innerHTML = `
            <iframe
                src="https://www.skai.gr/tv/live/"
                style="width:100%;height:100%;border:none;background:#000;"
                sandbox="allow-scripts allow-same-origin allow-popups"
            ></iframe>
            <div id="status">Skai Live (Clean-View)</div>
        `;
        return;
    }

    
// ⭐ Clean-View für Deluxe über Proxy
if (name.toLowerCase() === "deluxe") { 
        resetPlayerArea();
        stopVideo();
        const playerArea = document.getElementById("playerArea");
        playerArea.innerHTML = `
            <iframe
                src="https://deluxemusic.de/#google_vignette"
                style="width:100%;height:100%;border:none;background:#000;"
                sandbox="allow-scripts allow-same-origin allow-popups"
            ></iframe>
            <div id="status">Deluxe Live (Clean-View)</div>
        `;
        return;
    }
    // ⭐ Clean-View für ant1web
    if (name.toLowerCase() === "ant1web") {
        resetPlayerArea();
        stopVideo();
        const playerArea = document.getElementById("playerArea");
        playerArea.innerHTML = `
            <iframe
                src="https://www.antenna.gr/live"
                style="width:100%;height:100%;border:none;background:#000;"
                sandbox="allow-scripts allow-same-origin allow-popups"
            ></iframe>
            <div id="status">ANT1 Live (Clean-View)</div>
        `;
        return;
    }

    // ⭐ Clean‑View für megaweb
// ⭐ Clean‑View für megaweb
if (name.toLowerCase() === "megaweb") {
    resetPlayerArea();
    stopVideo();

    const playerArea = document.getElementById("playerArea");
    playerArea.innerHTML = `
        <iframe
           src="https://tasosiptv.vercel.app/api/proxy?url=https://www.megatv.com/live"
            //src="https://www.megatv.com/live"
            style="width:100%;height:100%;border:none;margin-top:-25px;"
            sandbox="allow-scripts allow-same-origin allow-popups"
        ></iframe>
        <div id="status">Mega TV Live (Clean‑View)</div>
    `;
    return;
}



    // ⭐ Clean-View für makweb
   if (name.toLowerCase() === "makweb") {
        resetPlayerArea();
        stopVideo();
        const playerArea = document.getElementById("playerArea");
        playerArea.innerHTML = `
            <iframe
                src="https://www.antenna.gr/livemak"
                style="width:100%;height:100%;border:none;background:#000;"
                sandbox="allow-scripts allow-same-origin allow-popups"
            ></iframe>
            <div id="status">Makedonia TV Live (Clean-View)</div>
        `;
        return;
    }

// ⭐ Clean-View für alphaweb über Proxy
 if (name.toLowerCase() === "alphaweb") {
    resetPlayerArea();
    stopVideo();

    const playerArea = document.getElementById("playerArea");
    playerArea.innerHTML = `
        <iframe
            src="${proxy + encodeURIComponent('https://www.alphatv.gr/live')}"
            style="width:100%;height:100%;border:none;background:#000;"
            sandbox="allow-scripts allow-same-origin allow-popups"
        ></iframe>
        <div id="status">Alpha TV Live (Clean-View über Proxy)</div>
    `;
    return;
}

    // ⭐ Clean‑View für skai sport
 if (name.toLowerCase() === "skai sport") {
    resetPlayerArea();
    stopVideo();

    const playerArea = document.getElementById("playerArea");
    playerArea.innerHTML = `
        <iframe
            src="https://www.sportfmtv.gr/el"
            style="width:100%;height:100%;border:none;background:#000;"
            sandbox="allow-scripts allow-same-origin allow-popups"
        ></iframe>
        <div id="status">SKAI Sport Live (Clean-View)</div>
    `;
    return;
}


    // ⭐ Clean‑View für mad
 if (name.toLowerCase() === "mad") {
    resetPlayerArea();
    stopVideo();

    const playerArea = document.getElementById("playerArea");
    playerArea.innerHTML = `
        <iframe
            src="https://www.youtube.com/embed/live_stream?channel=UCpXqQnZzY1QYzZzY1QYzZzA"
            style="width:100%;height:100%;border:none;background:#000;"
            allow="autoplay; encrypted-media"
        ></iframe>
        <div id="status">MAD TV Live (Clean-View)</div>
    `;
    return;
}

   // andere Web-Kanäle → neuer Tab (ohne Proxy)
if (webOnlyChannels[name]) {
    resetPlayerArea();
    stopVideo();
    window.open(webOnlyChannels[name], "_blank");
    setStatus("Web-Kanal geöffnet: " + ch.name);
    return;
}

// Normale Streams (HLS)
resetPlayerArea();
playChannel(index);
}


function playChannel(index) {
    const ch = channels[index];
    playStream(ch.url, ch.name);
}

function playStream(url, name) {
    const video = document.getElementById("video");

    if (hls) { hls.destroy(); hls = null; }

    setStatus("Starte Stream: " + name);

    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else {
        video.src = url;
        video.play();
    }
}

loadPlaylist();
</script>

</body>
</html>
