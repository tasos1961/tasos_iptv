<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IPTV TV Mode</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

#list {
    width: 35%;
    background: #111;
    padding: 10px;
    overflow: hidden;
}

.channel {
    padding: 18px;
    font-size: 22px;
    border-bottom: 1px solid #333;
    outline: none;
}

.channel:focus {
    background: #444;
}

#video {
    width: 65%;
    height: 100vh;
    background: #000;
}
</style>
</head>

<body>

<div id="list"></div>
<video id="video" controls autoplay></video>

<script>
const playlistURL = "https://gist.githubusercontent.com/tasos1961/ded73b64497f7a01f672962072d0a7ee/raw/BGREEK_TV.m3u";

let channels = [];
let hls = null;

/* ---------------- PLAYLIST LADEN ---------------- */
function loadPlaylist() {
    fetch(playlistURL)
        .then(r => r.text())
        .then(t => parseM3U(t));
}

function parseM3U(data) {
    const lines = data.split("\n");
    let name = "";

    lines.forEach(line => {
        if (line.startsWith("#EXTINF")) {
            name = line.split(",")[1];
        } else if (line.startsWith("http")) {
            channels.push({ name, url: line.trim() });
        }
    });

    renderList();
}

/* ---------------- LISTE RENDERN ---------------- */
function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    channels.forEach((ch, i) => {
        const div = document.createElement("div");
        div.textContent = ch.name;
        div.className = "channel";
        div.tabIndex = 0; // TV-Fokus aktivieren

        div.onfocus = () => {
            ensureVisible(div);
        };

        div.onclick = () => {
            playChannel(i);
        };

        div.onkeydown = (e) => {
            if (e.key === "Enter") {
                playChannel(i);
            }
        };

        list.appendChild(div);
    });

    // Ersten Kanal fokussieren
    list.children[0].focus();
}

/* ---------------- AUTOMATISCH SCROLLEN ---------------- */
function ensureVisible(element) {
    const list = document.getElementById("list");
    const rect = element.getBoundingClientRect();
    const listRect = list.getBoundingClientRect();

    if (rect.bottom > listRect.bottom) {
        list.scrollBy({ top: rect.bottom - listRect.bottom, behavior: "smooth" });
    }
    if (rect.top < listRect.top) {
        list.scrollBy({ top: rect.top - listRect.top, behavior: "smooth" });
    }
}

/* ---------------- KANAL ABSPIELEN ---------------- */
function playChannel(i) {
    const video = document.getElementById("video");
    const url = channels[i].url;

    if (hls) {
        hls.destroy();
        hls = null;
    }

    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else {
        video.src = url;
        video.play();
    }
}

loadPlaylist();
</script>

</body>
</html>
