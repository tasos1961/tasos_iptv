<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Tasos IPTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

#list {
    width: 35%;
    height: 100vh;
    background: #111;
    padding: 10px;
    overflow-y: scroll;
    position: fixed;
    left: 0;
    top: 0;
}

#playerArea {
    position: fixed;
    right: 0;
    top: 0;
    width: 65%;
    height: 100vh;
    background: #000;
}

#video, #iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

#iframe {
    border: none;
    display: none;
}

.channel {
    padding: 18px;
    font-size: 22px;
    border-bottom: 1px solid #333;
    cursor: pointer;
}

.channel:focus {
    background: #444;
}

.channel.active {
    background: #2a5f2a;
    font-weight: bold;
}

#fsBtn {
    position: absolute;
    right: 15px;
    top: 15px;
    z-index: 9999;
    padding: 10px 15px;
    font-size: 18px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: 1px solid #666;
    border-radius: 6px;
    cursor: pointer;
    display: none;
}
</style>
</head>

<body>

<div id="list"></div>

<div id="playerArea">
    <video id="video" controls autoplay playsinline></video>
    <iframe id="iframe"></iframe>
    <button id="fsBtn">Fullscreen</button>
</div>

<script>
const playlistURL = "https://gist.githubusercontent.com/tasos1961/ded73b64497f7a01f672962072d0a7ee/raw/BGREEK_TV.m3u";
let channels = [];
let hls = null;
let currentChannelIndex = -1;

// Direkt-Stream URLs - wie in IPTV Pro App
const directStreamOverrides = {
    "ant1": "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8",
    "ant1 hd": "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8",
    "ant1free": "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8",
    "ant1 free": "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8",
    "ant1free hd": "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8",
    "ant1 free hd": "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8"
};

/* --- Proxy-URL für Vercel --- */
const proxyBase = "https://tasosiptv.vercel.app/api/proxy?url=";

/* --- Web-Sender (über Proxy) --- */
const webOnlyChannels = {
    "ant1life": "https://www.antenna.gr/live",
    "mega hd": "https://www.megatv.com/live",
    "makedonia tv": "https://www.antenna.gr/live",
    "mad": "https://www.youtube.com/c/madtvgreece/live",
    "euronews": "https://www.youtube.com/euronewsGreek/live"
};

/* --- Video stoppen --- */
function stopVideo() {
    const video = document.getElementById("video");
    const iframe = document.getElementById("iframe");

    video.pause();
    video.src = "";
    video.removeAttribute("src");
    video.load();

    if (hls) {
        hls.destroy();
        hls = null;
    }

    iframe.src = "";
    iframe.style.display = "none";
}

/* --- Playlist laden --- */
function loadPlaylist() {
    fetch(playlistURL)
        .then(r => {
            if (!r.ok) throw new Error("Playlist fetch failed");
            return r.text();
        })
        .then(t => parseM3U(t))
        .catch(err => {
            console.warn("Playlist Fehler:", err);
            channels = [{ name: "ANT1", url: directStreamOverrides["ant1"] }];
            renderList();
            playChannel(0);
        });
}

/* --- M3U Parser --- */
function parseM3U(data) {
    const lines = data.split(/\r?\n/);
    let name = "";
    channels = [];

    lines.forEach(line => {
        line = line.trim();
        if (line.startsWith("#EXTINF")) {
            const parts = line.split(",");
            name = parts.length > 1 ? parts[1].trim() : "Unbenannt";
        } else if (line.startsWith("http://") || line.startsWith("https://")) {
            channels.push({ name, url: line });
        }
    });

    channels = channels.map(ch => {
        const key = ch.name.toLowerCase();
        if (directStreamOverrides[key]) {
            return { ...ch, url: directStreamOverrides[key] };
        }
        return ch;
    });

    renderList();

    if (channels.length > 0) {
        playChannel(0);
    }
}

/* --- Liste rendern --- */
function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    channels.forEach((ch, i) => {
        const div = document.createElement("div");
        div.textContent = ch.name;
        div.className = "channel";
        div.tabIndex = 0;

        div.onclick = () => handleChannel(ch, i);
        div.onkeydown = (e) => { if (e.key === "Enter") handleChannel(ch, i); };

        list.appendChild(div);
    });

    if (list.children.length > 0) list.children[0].focus();
}

/* --- Kanal-Handler --- */
function handleChannel(ch, i) {
    const name = ch.name.toLowerCase();
    const iframe = document.getElementById("iframe");

    if (webOnlyChannels[name]) {
        stopVideo();
        iframe.style.display = "block";
        iframe.src = proxyBase + encodeURIComponent(webOnlyChannels[name]);
        updateFullscreenButton();
        return;
    }

    iframe.style.display = "none";
    iframe.src = "";
    playChannel(i);
    updateFullscreenButton();
    updateActiveChannel(i);
}

/* --- Aktiven Kanal markieren --- */
function updateActiveChannel(index) {
    document.querySelectorAll(".channel").forEach((ch, i) => {
        if (i === index) ch.classList.add("active");
        else ch.classList.remove("active");
    });
    currentChannelIndex = index;
}

/* --- Direkt HLS abspielen (wie IPTV Pro) --- */
function playDirect(url) {
    const video = document.getElementById("video");

    if (hls) {
        hls.destroy();
        hls = null;
    }

    console.log("Playing:", url);

    if (Hls.isSupported()) {
        hls = new Hls({
            debug: false,
            enableWorker: true,
            lowLatencyMode: false,
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            maxBufferSize: 60 * 1000 * 1000,
            maxBufferHoleDuration: 30,
            fragLoadingTimeOut: 20000,
            fragLoadingMaxRetry: 6,
            levelLoadingTimeOut: 10000,
            levelLoadingMaxRetry: 4
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            console.log("Stream geladen");
            video.play().catch(err => console.log("Autoplay blockiert:", err));
        });

        hls.on(Hls.Events.ERROR, function(event, data) {
            if (data.fatal) {
                console.error("Fatal HLS error:", data.type, data.reason);
                switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        console.error("Netzwerkfehler - versuche Neu...");
                        setTimeout(() => hls.startLoad(), 3000);
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        console.error("Media-Fehler");
                        hls.recoverMediaError();
                        break;
                    default:
                        console.error("Unbekannter Fehler");
                        break;
                }
            }
        });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
            video.play().catch(err => console.log("Autoplay blockiert:", err));
        }, { once: true });
    } else {
        console.error("HLS nicht unterstützt");
    }
}

/* --- Kanal abspielen --- */
function playChannel(i) {
    if (!channels[i] || !channels[i].url) return;
    playDirect(channels[i].url);
}

/* --- Fullscreen per Maus --- */
function enterFullscreen() {
    const iframe = document.getElementById("iframe");
    if (iframe.style.display === "block") {
        if (iframe.requestFullscreen) iframe.requestFullscreen();
        else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
        else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
    }
}

document.getElementById("fsBtn").onclick = enterFullscreen;

/* --- Fullscreen Button anzeigen --- */
function updateFullscreenButton() {
    const iframe = document.getElementById("iframe");
    const fsBtn = document.getElementById("fsBtn");
    fsBtn.style.display = iframe.style.display === "block" ? "block" : "none";
}

loadPlaylist();
</script>

</body>
</html>
