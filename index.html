<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Tasos IPTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

#list {
    width: 35%;
    height: 100vh;
    background: #111;
    padding: 10px;
    overflow-y: scroll;
    position: fixed;
    left: 0;
    top: 0;
}

#playerArea {
    position: fixed;
    right: 0;
    top: 0;
    width: 65%;
    height: 100vh;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
}

#video, #iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

#iframe {
    border: none;
    display: none;
}

.channel {
    padding: 18px;
    font-size: 22px;
    border-bottom: 1px solid #333;
    cursor: pointer;
}

.channel:focus {
    background: #444;
}

.channel.active {
    background: #555;
}

#fsBtn {
    position: absolute;
    right: 15px;
    top: 15px;
    z-index: 9999;
    padding: 10px 15px;
    font-size: 18px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: 1px solid #666;
    border-radius: 6px;
    cursor: pointer;
    display: none;
}

#status {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 10px 15px;
    border-radius: 6px;
    font-size: 14px;
    z-index: 9998;
    display: none;
}

#status.error {
    color: #ff6b6b;
    display: block;
}

#status.loading {
    color: #ffd93d;
    display: block;
}
</style>
</head>

<body>

<div id="list"></div>

<div id="playerArea">
    <video id="video" controls autoplay></video>
    <iframe id="iframe"></iframe>
    <button id="fsBtn">Fullscreen</button>
    <div id="status"></div>
</div>

<script>
const playlistURL = "https://gist.githubusercontent.com/tasos1961/ded73b64497f7a01f672962072d0a7ee/raw/BGREEK_TV.m3u";
let channels = [];
let hls = null;
let currentChannelIndex = -1;

// Direkt-Stream für ANT1 / ANT1Free (mit Proxy-Fallback)
const directStreamOverrides = {
    "ant1": "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8",
    "ant1 hd": "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8",
    "ant1free": "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8",
    "ant1 free": "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8",
    "ant1free hd": "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8",
    "ant1 free hd": "https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8"
};

/* --- Proxy-URLs für CORS-Umgehung --- */
const proxyBase = "https://tasosiptv.vercel.app/api/proxy?url=";
const corsProxyBase = "https://cors-anywhere.herokuapp.com/";

/* --- Web-Sender (über Proxy) --- */
const webOnlyChannels = {
    "ant1life": "https://www.antenna.gr/live",
    "mega hd": "https://www.megatv.com/live",
    "makedonia tv": "https://www.antenna.gr/live",
    "mad": "https://www.youtube.com/c/madtvgreece/live",
    "euronews": "https://www.youtube.com/euronewsGreek/live"
};

/* --- Status anzeigen --- */
function showStatus(message, type = "loading") {
    const status = document.getElementById("status");
    status.textContent = message;
    status.className = type;
}

function hideStatus() {
    document.getElementById("status").className = "";
}

/* --- Video stoppen --- */
function stopVideo() {
    const video = document.getElementById("video");
    const iframe = document.getElementById("iframe");

    video.pause();
    video.src = "";
    video.removeAttribute("src");
    video.load();

    if (hls) {
        hls.destroy();
        hls = null;
    }

    iframe.src = "";
    iframe.style.display = "none";
    hideStatus();
}

/* --- Playlist laden --- */
function loadPlaylist() {
    showStatus("Playlist wird geladen...", "loading");
    fetch(playlistURL)
        .then(r => {
            if (!r.ok) throw new Error("Playlist fetch failed");
            return r.text();
        })
        .then(t => parseM3U(t))
        .catch(err => {
            console.error("Playlist Fehler:", err);
            showStatus("Playlist konnte nicht geladen werden. Verwende ANT1-Stream...", "error");
            channels = [{ name: "ANT1", url: directStreamOverrides["ant1"] }];
            renderList();
            playChannel(0);
        });
}

/* --- M3U Parser --- */
function parseM3U(data) {
    const lines = data.split(/\r?\n/);
    let name = "";
    channels = [];

    lines.forEach(line => {
        line = line.trim();
        if (line.startsWith("#EXTINF")) {
            const parts = line.split(",");
            name = parts.length > 1 ? parts[1].trim() : "Unbenannt";
        } else if (line.startsWith("http://") || line.startsWith("https://")) {
            channels.push({ name, url: line });
        }
    });

    // ANT1 Direkt-Stream überschreibt den ANT1-Eintrag aus der Playlist
    channels = channels.map(ch => {
        const key = ch.name.toLowerCase();
        if (directStreamOverrides[key]) {
            return { ...ch, url: directStreamOverrides[key] };
        }
        return ch;
    });

    renderList();

    if (channels.length > 0) {
        playChannel(0);
    } else {
        showStatus("Keine Kanäle in der Playlist gefunden.", "error");
    }
}

/* --- Liste rendern --- */
function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    channels.forEach((ch, i) => {
        const div = document.createElement("div");
        div.textContent = ch.name;
        div.className = "channel";
        div.tabIndex = 0;

        div.onclick = () => handleChannel(ch, i);
        div.onkeydown = (e) => { if (e.key === "Enter") handleChannel(ch, i); };

        list.appendChild(div);
    });

    if (list.children.length > 0) list.children[0].focus();
}

/* --- Kanal-Handler --- */
function handleChannel(ch, i) {
    const name = ch.name.toLowerCase();
    const iframe = document.getElementById("iframe");

    /* --- Web-Sender über Proxy --- */
    if (webOnlyChannels[name]) {
        stopVideo();
        iframe.style.display = "block";
        iframe.src = proxyBase + encodeURIComponent(webOnlyChannels[name]);
        updateFullscreenButton();
        return;
    }

    /* --- HLS-Sender direkt abspielen --- */
    iframe.style.display = "none";
    iframe.src = "";
    playChannel(i);
    updateFullscreenButton();
    updateActiveChannel(i);
}

/* --- Aktiven Kanal markieren --- */
function updateActiveChannel(index) {
    document.querySelectorAll(".channel").forEach((ch, i) => {
        if (i === index) ch.classList.add("active");
        else ch.classList.remove("active");
    });
    currentChannelIndex = index;
}

/* --- Direkt HLS abspielen --- */
function playDirect(url) {
    const video = document.getElementById("video");
    showStatus("Stream wird geladen...", "loading");

    if (hls) {
        hls.destroy();
        hls = null;
    }

    if (Hls.isSupported()) {
        hls = new Hls({
            xhrSetup: function(xhr) {
                xhr.withCredentials = false;
                xhr.setRequestHeader("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64)");
            },
            enableWorker: true,
            debug: false,
            progressive: true,
            lowLatencyMode: true
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            hideStatus();
            video.play().catch(() => {
                showStatus("Autoplay blockiert - klicke Play", "loading");
            });
        });

        hls.on(Hls.Events.ERROR, function(event, data) {
            console.error("HLS error:", data);
            if (data.fatal) {
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    showStatus("Netzwerkfehler - versuche mit Proxy...", "error");
                    retryWithProxy(url);
                } else {
                    showStatus("HLS Fehler: " + data.reason, "error");
                }
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
            hideStatus();
            video.play().catch(() => {
                showStatus("Autoplay blockiert", "loading");
            });
        }, { once: true });
        video.addEventListener('error', () => {
            showStatus("Video konnte nicht geladen werden", "error");
        }, { once: true });
    } else {
        showStatus("HLS wird nicht unterstützt", "error");
    }
}

/* --- Mit Proxy erneut versuchen --- */
function retryWithProxy(url) {
    const video = document.getElementById("video");
    const proxyUrl = corsProxyBase + url;
    
    if (hls) {
        hls.destroy();
        hls = null;
    }

    if (Hls.isSupported()) {
        hls = new Hls({
            xhrSetup: function(xhr) {
                xhr.withCredentials = false;
            },
            enableWorker: true,
            debug: false
        });

        hls.loadSource(proxyUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            hideStatus();
            video.play().catch(() => console.log("Autoplay blockiert."));
        });

        hls.on(Hls.Events.ERROR, function(event, data) {
            console.error("Proxy HLS error:", data);
            showStatus("Stream nicht verfügbar", "error");
        });
    }
}

/* --- Kanal abspielen (HLS aus Playlist) --- */
function playChannel(i) {
    if (!channels[i] || !channels[i].url) return;
    playDirect(channels[i].url);
}

/* --- Fullscreen per Maus --- */
function enterFullscreen() {
    const iframe = document.getElementById("iframe");
    if (iframe.style.display === "block") {
        if (iframe.requestFullscreen) iframe.requestFullscreen();
        else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
        else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
    }
}

document.getElementById("fsBtn").onclick = enterFullscreen;

/* --- Fullscreen Button anzeigen --- */
function updateFullscreenButton() {
    const iframe = document.getElementById("iframe");
    const fsBtn = document.getElementById("fsBtn");
    fsBtn.style.display = iframe.style.display === "block" ? "block" : "none";
}

loadPlaylist();
</script>

</body>
</html>
