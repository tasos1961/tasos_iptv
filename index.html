<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IPTV Browser Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body { margin:0; background:#000; color:#fff; font-family:sans-serif; display:flex; }
#list { width:30%; overflow-y:auto; background:#111; padding:10px; }
#list div { padding:10px; border-bottom:1px solid #333; cursor:pointer; }
#list div.selected { background:#444; }
#video { width:70%; height:100vh; background:#000; }
</style>
</head>
<body>
<div id="list"></div>
<video id="video" controls autoplay></video>
<script>
const playlistURL = "https://gist.githubusercontent.com/tasos1961/cf6cf91ffb47c11812750d35f01ac54d/raw/GREEK_TV.m3u";
let channels = [];
let selectedIndex = 0;
let hls;

function loadPlaylist() {
  fetch(playlistURL)
    .then(r => r.text())
    .then(t => parseM3U(t));
}

function parseM3U(data) {
  const lines = data.split("\n");
  let name = "";
  lines.forEach(line => {
    if (line.startsWith("#EXTINF")) name = line.split(",")[1];
    else if (line.startsWith("http")) channels.push({ name, url: line.trim() });
  });
  renderList();
  playChannel(0);
}

function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  channels.forEach((ch, i) => {
    const div = document.createElement("div");
    div.textContent = ch.name;
    div.className = i === selectedIndex ? "selected" : "";
    div.onclick = () => { selectedIndex = i; renderList(); playChannel(i); };
    list.appendChild(div);
  });
}

function playChannel(i) {
  const video = document.getElementById("video");
  const url = channels[i].url;
  if (hls) hls.destroy();
  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
  } else {
    video.src = url;
    video.play();
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { selectedIndex = (selectedIndex + 1) % channels.length; renderList(); playChannel(selectedIndex); }
  if (e.key === "ArrowUp") { selectedIndex = (selectedIndex - 1 + channels.length) % channels.length; renderList(); playChannel(selectedIndex); }
});

loadPlaylist();
</script>
</body>
</html>
