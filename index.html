<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Zugriff geschützt</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #111; color: white; margin: 0; }
        .box { text-align: center; padding: 30px; border: 1px solid #333; border-radius: 8px; background: #161616; width: 300px; }
        input { padding: 10px; border: 1px solid #444; background: #222; color: white; border-radius: 4px; width: 90%; margin-bottom: 15px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #0062d2; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Playlist Login</h2>
        <input type="text" id="username" placeholder="Dein Name">
        <input type="password" id="pw" placeholder="Dein Passwort">
        <button onclick="checkLogin()">Einloggen</button>
    </div>

    <script>
        // HIER kannst du für jeden Nutzer ein eigenes Passwort festlegen:
        const ERLAUBTE_NUTZER = {
            "user1": "6543",
            "user2": "6543",
            "user3": "6543"
        };

    function checkLogin() {
    const nameInput = document.getElementById('username').value.trim().toLowerCase();
    const passwordInput = document.getElementById('pw').value.trim();

    if (ERLAUBTE_NUTZER[nameInput] && ERLAUBTE_NUTZER[nameInput] === passwordInput) {
        
        // Cookie setzen
        document.cookie = "authorized_user=true; path=/; max-age=604800; SameSite=Strict; Secure";
        
        // Zwinge den Browser, die Hauptseite komplett neu vom Server abzurufen
        window.location.href = window.location.origin + "/"; 
    } else {
        alert("Name oder Passwort ist falsch!");
    }
}

    </script>
</body>
</html>
