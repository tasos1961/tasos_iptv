<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tasos TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

#list {
    width: 35%;
    height: 100vh;
    background: #111;
    padding: 10px;
    overflow-y: scroll;
    position: fixed;
    left: 0;
    top: 0;
}

#playerArea {
    position: fixed;
    right: 0;
    top: 0;
    width: 65%;
    height: 100vh;
    background: #000;
}

#video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

.channel {
    padding: 18px;
    font-size: 22px;
    border-bottom: 1px solid #333;
    cursor: pointer;
}

.channel:focus {
    background: #444;
}
</style>
</head>

<body>

<div id="list"></div>

<div id="playerArea">
    <video id="video" controls autoplay></video>
</div>

<script>
const playlistURL = "https://gist.githubusercontent.com/tasos1961/ded73b64497f7a01f672962072d0a7ee/raw/BGREEK_TV.m3u";

let channels = [];
let hls = null;

/* --- Web-Sender (neuer Tab) --- */
const webOnlyChannels = {
    "mega hd": "https://www.megatv.com/live",
    "ant1life": "https://www.antenna.gr/live",
    "makedonia tv": "https://www.antenna.gr/live",
    "pontos": "https://www.youtube.com/@PontosTV/live",
    "mad": "https://www.youtube.com/c/madtvgreece/live",
    "euronews": "https://www.youtube.com/euronewsGreek/live"
};

/* --- Player-Sender (HLS) --- */
const playerChannels = {
    // ant1free entfernt
};

/* --- Video stoppen --- */
function stopVideo() {
    const video = document.getElementById("video");
    video.pause();
    video.src = "";
    if (hls) { hls.destroy(); hls = null; }
}

/* --- Playlist laden --- */
function loadPlaylist() {
    fetch(playlistURL)
        .then(r => r.text())
        .then(t => parseM3U(t));
}

/* --- M3U Parser --- */
function parseM3U(data) {
    const lines = data.split(/\r?\n/);
    let name = "";

    lines.forEach(line => {
        line = line.trim();
        if (line.startsWith("#EXTINF")) {
            const parts = line.split(",");
            name = parts.length > 1 ? parts[1].trim() : "Unbenannt";
        } else if (line.startsWith("http://") || line.startsWith("https://")) {
            channels.push({ name, url: line });
        }
    });

    renderList();
    if (channels.length > 0) playChannel(0);
}

/* --- Liste rendern --- */
function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    channels.forEach((ch, i) => {
        const div = document.createElement("div");
        div.textContent = ch.name;
        div.className = "channel";
        div.tabIndex = 0;

        div.onclick = () => handleChannel(ch, i);
        div.onkeydown = (e) => { if (e.key === "Enter") handleChannel(ch, i); };

        list.appendChild(div);
    });

    if (list.children.length > 0) list.children[0].focus();
}

/* --- Kanal-Handler --- */
function handleChannel(ch, i) {
    const name = ch.name.toLowerCase();

    /* --- Player-Sender (HLS) --- */
    if (playerChannels[name]) {
        playDirect(playerChannels[name]);
        return;
    }

    /* --- Web-Sender (neuer Tab) --- */
    if (webOnlyChannels[name]) {
        stopVideo();
        window.open(webOnlyChannels[name], "_blank");
        return;
    }

    /* --- Normale HLS-Sender --- */
    playChannel(i);
}

/* --- Direkt HLS abspielen --- */
function playDirect(url) {
    const video = document.getElementById("video");

    if (hls) { hls.destroy(); hls = null; }

    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else {
        video.src = url;
        video.play();
    }
}

/* --- Kanal abspielen (HLS aus Playlist) --- */
function playChannel(i) {
    playDirect(channels[i].url);
}

loadPlaylist();
</script>

</body>
</html>
