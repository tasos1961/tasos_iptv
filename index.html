<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tasos TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* --- FIXIERTE LISTE LINKS --- */
#list {
    width: 35%;
    height: 100vh;
    background: #111;
    padding: 10px;
    overflow-y: scroll;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    position: fixed;
    left: 0;
    top: 0;
}

/* --- VIDEO / IFRAME RECHTS --- */
#playerArea {
    position: fixed;
    right: 0;
    top: 0;
    width: 65%;
    height: 100vh;
    background: #000;
    overflow: hidden;
}

#video, #iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

#iframe {
    border: none;
    display: none;
}

.channel {
    padding: 18px;
    font-size: 22px;
    border-bottom: 1px solid #333;
    outline: none;
    cursor: pointer;
}

.channel:focus {
    background: #444;
}

/* --- Fullscreen Button --- */
#fsBtn {
    position: absolute;
    right: 15px;
    top: 15px;
    z-index: 9999;
    padding: 10px 15px;
    font-size: 18px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: 1px solid #666;
    border-radius: 6px;
    cursor: pointer;
    display: none;
}
</style>
</head>

<body>

<div id="list"></div>

<div id="playerArea">
    <video id="video" controls autoplay></video>
    <iframe id="iframe"></iframe>
    <button id="fsBtn">Fullscreen</button>
</div>

<script>
const playlistURL = "https://gist.githubusercontent.com/tasos1961/ded73b64497f7a01f672962072d0a7ee/raw/BGREEK_TV.m3u";

let channels = [];
let hls = null;

/* --- Web-Only Sender --- */
const webOnlyChannels = {
    "mega hd": "https://www.megatv.com/live",
    "ant1": "https://www.antenna.gr/live",
    "makedonia tv": "https://www.antenna.gr/live",
    "pontos": "https://www.youtube.com/@PontosTV/live",
    "mad": "https://www.youtube.com/c/madtvgreece/live",
    "euronews": "https://www.youtube.com/euronewsGreek/live"
};

/* --- Video stoppen --- */
function stopVideo() {
    const video = document.getElementById("video");
    video.pause();
    video.src = "";
    if (hls) { hls.destroy(); hls = null; }
}

/* --- Playlist laden --- */
function loadPlaylist() {
    fetch(playlistURL)
        .then(r => r.text())
        .then(t => parseM3U(t));
}

/* --- M3U Parser --- */
function parseM3U(data) {
    const lines = data.split(/\r?\n/);
    let name = "";

    lines.forEach(line => {
        line = line.trim();
        if (line.startsWith("#EXTINF")) {
            const parts = line.split(",");
            name = parts.length > 1 ? parts[1].trim() : "Unbenannt";
        } else if (line.startsWith("http://") || line.startsWith("https://")) {
            channels.push({ name, url: line });
        }
    });

    renderList();
    if (channels.length > 0) playChannel(0);
}

/* --- Liste rendern --- */
function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    channels.forEach((ch, i) => {
        const div = document.createElement("div");
        div.textContent = ch.name;
        div.className = "channel";
        div.tabIndex = 0;

        div.onclick = () => handleChannel(ch, i);
        div.onkeydown = (e) => { if (e.key === "Enter") handleChannel(ch, i); };

        list.appendChild(div);
    });

    if (list.children.length > 0) list.children[0].focus();
}

/* --- Kanal-Handler --- */
function handleChannel(ch, i) {
    const name = ch.name.toLowerCase();
    const iframe = document.getElementById("iframe");

    /* --- MEGA HD --- */
    if (name === "mega hd") {
        stopVideo();
        iframe.style.display = "block";
        iframe.src = webOnlyChannels["mega hd"];
        updateFullscreenButton();
        return;
    }

    /* --- Mega News (HLS) --- */
    if (name === "mega news") {
        iframe.style.display = "none";
        playChannel(i);
        updateFullscreenButton();
        return;
    }

    /* --- Andere Web-Sender --- */
    for (const key in webOnlyChannels) {
        if (name === key) {
            stopVideo();
            iframe.style.display = "block";
            iframe.src = webOnlyChannels[key];
            updateFullscreenButton();
            return;
        }
    }

    /* --- Normale Sender --- */
    iframe.style.display = "none";
    playChannel(i);
    updateFullscreenButton();
}

/* --- Kanal abspielen --- */
function playChannel(i) {
    const video = document.getElementById("video");
    const url = channels[i].url;

    if (hls) { hls.destroy(); hls = null; }

    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else {
        video.src = url;
        video.play();
    }
}

/* --- Fullscreen per Maus --- */
function enterFullscreen() {
    const iframe = document.getElementById("iframe");
    if (iframe.style.display === "block") {
        if (iframe.requestFullscreen) iframe.requestFullscreen();
        else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
        else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
    }
}

document.getElementById("fsBtn").onclick = enterFullscreen;

/* --- Fullscreen Button anzeigen --- */
function updateFullscreenButton() {
    const iframe = document.getElementById("iframe");
    const fsBtn = document.getElementById("fsBtn");
    fsBtn.style.display = iframe.style.display === "block" ? "block" : "none";
}

/* --- Popup-Blocker für MEGA HD --- */
function megaPopupBlocker() {
    const iframe = document.getElementById("iframe");
    if (iframe.style.display !== "block") return;

    try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;

        const closeBtn = doc.querySelector(
            'button[aria-label="Close"], .close, .popup-close, .mfp-close'
        );

        if (closeBtn) {
            closeBtn.click();
            console.log("MEGA Popup geschlossen");
        }

        const popup = doc.querySelector('.modal, .popup, .newsletter, .insider');
        if (popup) {
            popup.style.display = "none";
            console.log("MEGA Popup versteckt");
        }

    } catch (e) {}
}

setInterval(megaPopupBlocker, 2000);

/* --- Auto-Klick für ANT1 --- */
function ant1AutoClick() {
    const iframe = document.getElementById("iframe");
    if (iframe.style.display !== "block") return;
    if (!iframe.src.includes("antenna.gr")) return;

    try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;

        const liveBtn = doc.querySelector('a[href*="live"], button:contains("Live"), .live-button');
        if (liveBtn) {
            liveBtn.click();
            console.log("ANT1 Auto-Klick: LiveTV gedrückt");
        }

        const geoBlock = doc.querySelector('.geoblock, .modal, .popup, .alert');
        if (geoBlock) {
            geoBlock.style.display = "none";
            console.log("ANT1 Geo-Block entfernt");
        }

    } catch (e) {}
}

setInterval(ant1AutoClick, 3000);

/* --- Session-Keeper --- */
function sessionKeeper() {
    const iframe = document.getElementById("iframe");
    if (iframe.style.display !== "block") return;

    try {
        iframe.contentWindow.postMessage("ping", "*");
        console.log("Session-Keeper Ping gesendet");
    } catch (e) {}
}

setInterval(sessionKeeper, 120000);

/* --- Auto-Reconnect --- */
function autoReconnect() {
    const iframe = document.getElementById("iframe");
    if (iframe.style.display !== "block") return;

    try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        const text = doc.body ? doc.body.innerText.toLowerCase() : "";

        if (text.includes("forbidden") ||
            text.includes("permission") ||
            text.includes("error")) {

            console.log("Auto-Reconnect ausgelöst");
            iframe.src = iframe.src;
        }
    } catch (e) {}

}

setInterval(autoReconnect, 180000);

loadPlaylist();
</script>

</body>
</html>
