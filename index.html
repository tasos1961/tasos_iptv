<script>
const playlistURL = "https://gist.githubusercontent.com/tasos1961/cf6cf91ffb47c11812750d35f01ac54d/raw/GREEK_TV.m3u";

let channels = [];
let selectedIndex = 0;
let hls;

function loadPlaylist() {
    fetch(playlistURL)
        .then(response => response.text())
        .then(text => parseM3U(text));
}

function parseM3U(data) {
    const lines = data.split("\n");
    let name = "";
    lines.forEach(line => {
        if (line.startsWith("#EXTINF")) {
            name = line.split(",")[1];
        } else if (line.startsWith("http")) {
            channels.push({ name:name, url:line.trim() });
        }
    });
    renderList();
    playChannel(0);
}

function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    channels.forEach((ch, i) => {
        const div = document.createElement("div");
        div.textContent = ch.name;
        div.className = i === selectedIndex ? "selected" : "";
        div.onclick = () => {
            selectedIndex = i;
            renderList();
            playChannel(i);
        };
        list.appendChild(div);
    });
}

function playChannel(index) {
    const video = document.getElementById("video");
    const url = channels[index].url;

    if (hls) hls.destroy(); // stop previous stream
    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else {
        video.src = url;
    }
}

document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") {
        selectedIndex = (selectedIndex + 1) % channels.length;
        renderList();
        playChannel(selectedIndex);
    }
    if (e.key === "ArrowUp") {
        selectedIndex = (selectedIndex - 1 + channels.length) % channels.length;
        renderList();
        playChannel(selectedIndex);
    }
    if (e.key === "Enter") {
        playChannel(selectedIndex);
    }
});

loadPlaylist();
</script>
