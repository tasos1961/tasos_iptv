<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IPTV TV Mode</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* --- FIXIERTE LISTE LINKS --- */
#list {
    width: 35%;
    height: 100vh;
    background: #111;
    padding: 10px;
    overflow-y: scroll;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    position: fixed;
    left: 0;
    top: 0;
}

/* --- VIDEO / IFRAME RECHTS --- */
#playerArea {
    position: fixed;
    right: 0;
    top: 0;
    width: 65%;
    height: 100vh;
    background: #000;
    overflow: hidden;
}

#video, #iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

#iframe {
    border: none;
    display: none; /* nur verstecken, NICHT löschen */
}

.channel {
    padding: 18px;
    font-size: 22px;
    border-bottom: 1px solid #333;
    outline: none;
    cursor: pointer;
}

.channel:focus {
    background: #444;
}
</style>
</head>

<body>

<div id="list"></div>

<div id="playerArea">
    <video id="video" controls autoplay></video>
    <iframe id="iframe"></iframe>
</div>

<script>
const playlistURL = "https://gist.githubusercontent.com/tasos1961/ded73b64497f7a01f672962072d0a7ee/raw/BGREEK_TV.m3u";

let channels = [];
let hls = null;

/* --- Web-Only Sender (nur MEGA HD, NICHT Mega News!) --- */
const webOnlyChannels = {
    "mega hd": "https://www.megatv.com/live",
    "ant1": "https://www.antenna.gr/live",
    "makedonia tv": "https://www.antenna.gr/live",
    "pontos": "https://www.youtube.com/@PontosTV/live",
    "mad": "https://www.youtube.com/c/madtvgreece/live",
    "euronews": "https://www.youtube.com/euronewsGreek/live"
};

/* --- Video stoppen --- */
function stopVideo() {
    const video = document.getElementById("video");

    video.pause();
    video.src = "";

    if (hls) {
        hls.destroy();
        hls = null;
    }
}

/* --- Playlist laden --- */
function loadPlaylist() {
    fetch(playlistURL)
        .then(r => r.text())
        .then(t => parseM3U(t));
}

/* --- M3U Parser --- */
function parseM3U(data) {
    const lines = data.split(/\r?\n/);
    let name = "";

    lines.forEach(line => {
        line = line.trim();

        if (line.startsWith("#EXTINF")) {
            const parts = line.split(",");
            name = parts.length > 1 ? parts[1].trim() : "Unbenannt";
        } 
        else if (line.startsWith("http://") || line.startsWith("https://")) {
            channels.push({ name, url: line });
        }
    });

    renderList();

    if (channels.length > 0) {
        playChannel(0);
    }
}

/* --- Liste rendern --- */
function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    channels.forEach((ch, i) => {
        const div = document.createElement("div");
        div.textContent = ch.name;
        div.className = "channel";
        div.tabIndex = 0;

        div.onclick = () => handleChannel(ch, i);

        div.onkeydown = (e) => {
            if (e.key === "Enter") handleChannel(ch, i);
        };

        list.appendChild(div);
    });

    if (list.children.length > 0) {
        list.children[0].focus();
    }
}

/* --- Kanal-Handler (Variante B + MEGA HD Fix + Mega News Fix) --- */
function handleChannel(ch, i) {
    const name = ch.name.toLowerCase();
    const iframe = document.getElementById("iframe");

    /* --- MEGA HD → Webseite --- */
    if (name === "mega hd") {
        stopVideo();
        iframe.style.display = "block";
        iframe.src = webOnlyChannels["mega hd"];
        return;
    }

    /* --- Mega News → HLS Stream --- */
    if (name === "mega news") {
        iframe.style.display = "none";
        playChannel(i);
        return;
    }

    /* --- Andere WebOnly-Sender --- */
    for (const key in webOnlyChannels) {
        if (name === key) {
            stopVideo();
            iframe.style.display = "block";
            iframe.src = webOnlyChannels[key];
            return;
        }
    }

    /* --- Normale Sender --- */
    iframe.style.display = "none";
    playChannel(i);
}

/* --- Kanal abspielen --- */
function playChannel(i) {
    const video = document.getElementById("video");
    const url = channels[i].url;

    if (hls) {
        hls.destroy();
        hls = null;
    }

    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else {
        video.src = url;
        video.play();
    }
}

/* --- Auto-Reconnect-System --- */
function autoReconnect() {
    const iframe = document.getElementById("iframe");

    if (iframe.style.display === "block") {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            const text = iframeDoc.body ? iframeDoc.body.innerText.toLowerCase() : "";

            if (text.includes("forbidden") || text.includes("permission")) {
                console.log("Auto-Reconnect: Web-Sender neu laden...");
                iframe.src = iframe.src;
            }
        } catch (e) {}
    }

    setTimeout(autoReconnect, 180000);
}

window.addEventListener("load", autoReconnect);

loadPlaylist();
</script>

</body>
</html>
