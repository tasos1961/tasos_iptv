<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IPTV Browser Player</title>
<style>
    body { margin:0; background:#111; color:#fff; font-family:Arial; }
    #container { display:flex; height:100vh; }
    #list {
        width:35%; background:#222; overflow-y:auto; padding:10px;
    }
    #list div {
        padding:10px; margin-bottom:5px; background:#333; cursor:pointer;
    }
    #list .selected {
        background:#555;
    }
    #player {
        width:65%; background:#000; display:flex; align-items:center; justify-content:center;
    }
    video { width:100%; height:100%; background:#000; }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div id="container">
    <div id="list"></div>
    <div id="player"><video id="video" controls autoplay></video></div>
</div>

<script>
const playlistURL = "https://gist.githubusercontent.com/tasos1961/cf6cf91ffb47c11812750d35f01ac54d/raw/GREEK_TV.m3u";

let channels = [];
let selectedIndex = 0;

function loadPlaylist() {
    fetch(playlistURL)
        .then(response => response.text())
        .then(text => parseM3U(text));
}

function parseM3U(data) {
    const lines = data.split("\n");
    let name = "";
    lines.forEach(line => {
        if (line.startsWith("#EXTINF")) {
            name = line.split(",")[1];
        } else if (line.startsWith("http")) {
            channels.push({ name:name, url:line.trim() });
        }
    });
    renderList();
    playChannel(0);
}

function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    channels.forEach((ch, i) => {
        const div = document.createElement("div");
        div.textContent = ch.name;
        if (i === selectedIndex) div.classList.add("selected");
        list.appendChild(div);
    });
}

function playChannel(index) {
    const video = document.getElementById("video");
    const url = channels[index].url;

    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else {
        video.src = url;
    }
}

document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") {
        selectedIndex = (selectedIndex + 1) % channels.length;
        renderList();
    }
    if (e.key === "ArrowUp") {
        selectedIndex = (selectedIndex - 1 + channels.length) % channels.length;
        renderList();
    }
    if (e.key === "Enter") {
        playChannel(selectedIndex);
    }
});

loadPlaylist();
</script>

</body>
</html>
