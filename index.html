<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IPTV TV Mode</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* --- FIXIERTE LISTE LINKS --- */
#list {
    width: 35%;
    height: 100vh;
    background: #111;
    padding: 10px;
    overflow-y: scroll;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    position: fixed;
    left: 0;
    top: 0;
}

/* --- VIDEO / IFRAME RECHTS --- */
#playerArea {
    position: fixed;
    right: 0;
    top: 0;
    width: 65%;
    height: 100vh;
    background: #000;
    overflow: hidden;
}

#video, #iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}


.channel {
    padding: 18px;
    font-size: 22px;
    border-bottom: 1px solid #333;
    outline: none;
    cursor: pointer;
}

.channel:focus {
    background: #444;
}
</style>
</head>

<body>

<div id="list"></div>

<div id="playerArea">
    <video id="video" controls autoplay></video>
    <iframe id="iframe"></iframe>
</div>

<script>
const playlistURL = "https://gist.githubusercontent.com/tasos1961/ded73b64497f7a01f672962072d0a7ee/raw/BGREEK_TV.m3u";

let channels = [];
let hls = null;

/* --- Web-Only Sender (lowercase keys!) --- */
const webOnlyChannels = {
    "ant1": "https://www.antenna.gr/live",
    "pontos": "https://www.youtube.com/@PontosTV/live",
    "mad": "https://www.mad.tv/live",
    "nrg": "http://tv.nrg91.gr:1935/onweb/live/master.m3u8",
    "euronews": "https://www.euronews.com/live"
};

/* --- Video stoppen --- */
function stopVideo() {
    const video = document.getElementById("video");
    const iframe = document.getElementById("iframe");

    video.pause();
    video.src = "";
    iframe.src = "";
    iframe.style.display = "none";

    if (hls) {
        hls.destroy();
        hls = null;
    }
}

/* --- Playlist laden --- */
function loadPlaylist() {
    fetch(playlistURL)
        .then(r => r.text())
        .then(t => parseM3U(t));
}

/* --- M3U Parser --- */
function parseM3U(data) {
    const lines = data.split(/\r?\n/);
    let name = "";

    lines.forEach(line => {
        line = line.trim();

        if (line.startsWith("#EXTINF")) {
            const parts = line.split(",");
            name = parts.length > 1 ? parts[1].trim() : "Unbenannt";
        } 
        else if (line.startsWith("http://") || line.startsWith("https://")) {
            channels.push({ name, url: line });
        }
    });

    renderList();

    if (channels.length > 0) {
        playChannel(0);
    }
}

/* --- Liste rendern --- */
function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    channels.forEach((ch, i) => {
        const div = document.createElement("div");
        div.textContent = ch.name;
        div.className = "channel";
        div.tabIndex = 0;

        /* --- KLICK --- */
        div.onclick = () => handleChannel(ch, i);

        /* --- ENTER-TASTE --- */
        div.onkeydown = (e) => {
            if (e.key === "Enter") handleChannel(ch, i);
        };

        list.appendChild(div);
    });

    if (list.children.length > 0) {
        list.children[0].focus();
    }
}

/* --- Kanal-Handler --- */
function handleChannel(ch, i) {
    const name = ch.name.toLowerCase();

    for (const key in webOnlyChannels) {
        if (name.includes(key)) {
            stopVideo();
            const iframe = document.getElementById("iframe");
            iframe.src = webOnlyChannels[key];
            iframe.style.display = "block";
            return;
        }
    }

    playChannel(i);
}

/* --- Kanal abspielen --- */
function playChannel(i) {
    const video = document.getElementById("video");
    const iframe = document.getElementById("iframe");
    const url = channels[i].url;

    iframe.style.display = "none";
    iframe.src = "";

    if (hls) {
        hls.destroy();
        hls = null;
    }

    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else {
        video.src = url;
        video.play();
    }
}

loadPlaylist();
</script>

</body>
</html>
